name: Android CI

on:
  push:
    branches: [main, master]
    paths:
      - 'MobiQA-Android-Revising/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'MobiQA-Android-Revising/**'
      - '.github/workflows/ci-android.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: MobiQA-Android-Revising

jobs:
  # ──────────────────────────────────────────────
  # Lint
  # ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  # ──────────────────────────────────────────────
  # Unit Tests (JVM, no emulator)
  # ──────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Instrumented Tests (Android Emulator)
  # Disabled for now — requires real Espresso tests
  # and Baidu SDK is incompatible with x86 emulators.
  # Re-enable when real UI tests are written.
  # ──────────────────────────────────────────────
