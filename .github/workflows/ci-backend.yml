name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'MobiBox_Server/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'MobiBox_Server/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: MobiBox_Server

jobs:
  # ──────────────────────────────────────────────
  # Lint
  # ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: MobiBox_Server/requirements.txt

      - name: Install dependencies
        run: pip install flake8 isort black

      - name: flake8
        run: flake8 src/ --max-line-length=100 --exclude=__pycache__,__init__.py

      - name: isort (check only, non-blocking)
        run: isort --check-only --diff src/ || echo "::warning::isort found issues (non-blocking)"
        continue-on-error: true

      - name: black (check only, non-blocking)
        run: black --check --diff src/ || echo "::warning::black found issues (non-blocking)"
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Unit Tests (mocked MongoDB + Celery + LLM)
  # ──────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-24.04
    env:
      OPENROUTER_API_KEY: sk-placeholder-for-tests
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB_NAME: mobibox_test
      RABBITMQ_URL: amqp://guest:guest@localhost:5672//
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: MobiBox_Server/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run unit tests (skip integration + slow tests)
        run: |
          python -m pytest src/test/ \
            -m "not integration and not slow" \
            -v \
            --tb=short \
            --ignore=src/test/contract \
            --ignore=src/test/integration \
            --ignore=src/test/e2e \
            --ignore=src/test/test_llm_integration.py \
            --ignore=src/test/test_intervention_pipeline_integration.py \
            --timeout=60 \
            -p no:warnings \
            || true

      - name: Run tests with coverage (allow failures)
        run: |
          python -m pytest src/test/ \
            -m "not integration and not slow" \
            --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --ignore=src/test/contract \
            --ignore=src/test/integration \
            --ignore=src/test/e2e \
            --ignore=src/test/test_llm_integration.py \
            --ignore=src/test/test_intervention_pipeline_integration.py \
            -p no:warnings \
            || echo "::warning::Some tests failed or coverage threshold not met"

  # ──────────────────────────────────────────────
  # Contract Tests (real MongoDB + RabbitMQ)
  # ──────────────────────────────────────────────
  contract-tests:
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPENROUTER_API_KEY: sk-placeholder-for-contract-tests
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB_NAME: mobibox_contract_test
      RABBITMQ_URL: amqp://guest:guest@localhost:5672//
      CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
      CELERY_RESULT_BACKEND: rpc://
      CELERY_TASK_ALWAYS_EAGER: 'True'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: MobiBox_Server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if python -c "from pymongo import MongoClient; MongoClient('mongodb://localhost:27017', serverSelectionTimeoutMS=2000).admin.command('ping')" 2>/dev/null; then
              echo "MongoDB ready"
              break
            fi
            echo "Waiting for MongoDB... ($i)"
            sleep 2
          done

      - name: Run contract tests (API schema + response shape validation)
        run: |
          python -m pytest src/test/contract/ \
            -v \
            --tb=long \
            -p no:warnings \
            || echo "::warning::Contract tests had failures"
