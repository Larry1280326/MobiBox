name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'MobiBox_Server/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'MobiBox_Server/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: MobiBox_Server

jobs:
  # ──────────────────────────────────────────────
  # Lint
  # ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: MobiBox_Server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: flake8
        run: flake8 src/ --max-line-length=100 --exclude=__pycache__,__init__.py

      - name: isort (check only)
        run: isort --check-only --diff src/

      - name: black (check only)
        run: black --check --diff src/

  # ──────────────────────────────────────────────
  # Unit Tests (mocked MongoDB + Celery + LLM)
  # ──────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-24.04
    env:
      OPENROUTER_API_KEY: sk-placeholder-for-tests
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB_NAME: mobibox_test
      RABBITMQ_URL: amqp://guest:guest@localhost:5672//
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: MobiBox_Server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest src/test/ \
            -m "not integration" \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: MobiBox_Server/coverage.xml
          flags: backend
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Contract Tests (real MongoDB + RabbitMQ)
  # ──────────────────────────────────────────────
  contract-tests:
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPENROUTER_API_KEY: sk-placeholder-for-contract-tests
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB_NAME: mobibox_contract_test
      RABBITMQ_URL: amqp://guest:guest@localhost:5672//
      CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
      CELERY_RESULT_BACKEND: rpc://
      CELERY_TASK_ALWAYS_EAGER: 'True'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: MobiBox_Server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if python -c "from pymongo import MongoClient; MongoClient('mongodb://localhost:27017').admin.command('ping')" 2>/dev/null; then
              echo "MongoDB ready"
              break
            fi
            echo "Waiting for MongoDB... ($i)"
            sleep 2
          done

      - name: Run contract tests
        run: |
          pytest src/test/contract/ \
            -v \
            --tb=long \
            -m "not integration or (integration and contract)"

      - name: Run integration tests
        run: |
          pytest src/test/integration/ \
            -v \
            --tb=long \
            -m "not integration"
