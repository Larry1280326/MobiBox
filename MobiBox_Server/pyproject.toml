[tool.black]
line-length = 100
target-version = ['py311']
exclude = '''
/(
    __pycache__
  | \.git
  | \.venv
  | venv
  | env
  | build
  | dist
  | \.egg-info
  | models
  | logs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["src/test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (require real API credentials)",
    "contract: marks tests as contract tests (require real MongoDB/RabbitMQ)",
]
