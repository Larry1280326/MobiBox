plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.mobibox'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.mobibox"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 明确支持16KB页面大小
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    lintOptions {
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }

    // Robolectric needs Android resources in unit tests
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    // 支持16KB页面大小 (Android 15+ 要求)
    packaging {
        jniLibs {
            useLegacyPackaging = false
            // 保持第三方库的调试符号
            keepDebugSymbols += ['**/liblocSDK8b.so', '**/libindoor.so']
        }
        // 确保所有native库按16KB边界对齐
        resources {
            pickFirsts += ['**/*.so']
        }
    }
    
    //用百度SDK 設置
    sourceSets{
        main{
            jniLibs.srcDirs=['libs']
        }
    }
}

// 添加任务：检查第三方so库的16KB对齐状态
tasks.register('check16KBAlignment') {
    group = 'verification'
    description = 'Check if third-party native libraries support 16KB page size'
    
    doLast {
        logger.warn("=" * 80)
        logger.warn("16KB Page Size Compatibility Check")
        logger.warn("=" * 80)
        logger.warn("")
        logger.warn("Current Baidu Location SDK libraries are NOT 16KB-aligned:")
        logger.warn("  - liblocSDK8b.so")
        logger.warn("  - libindoor.so")
        logger.warn("")
        logger.warn("This is a known limitation of the Baidu SDK.")
        logger.warn("")
        logger.warn("Solutions:")
        logger.warn("  1. Contact Baidu to request 16KB-aligned SDK versions")
        logger.warn("  2. Wait for Baidu to release updated SDKs before November 2025")
        logger.warn("  3. Consider using alternative location SDKs (Google Play Services, etc.)")
        logger.warn("")
        logger.warn("Note: This warning does not affect app functionality on current devices.")
        logger.warn("=" * 80)
    }
}

